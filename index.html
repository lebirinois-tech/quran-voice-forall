<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    
    <!-- App Info -->
    <title>Apprenons le Coran</title>
    <meta name="description" content="Application coranique accessible avec commandes vocales, Tajweed coloré et Tafsir audio" />
    <meta name="author" content="Apprenons le Coran" />
    <meta name="keywords" content="Quran, Coran, Islam, Tajweed, Tafsir, Accessible, Voice Commands" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1B5E20" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Apprenons le Coran" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Apprenons le Coran" />
    <meta name="msapplication-TileColor" content="#1B5E20" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Manifest statique : nécessaire pour que Chrome/Edge (Windows) détectent
         l'éligibilité à l'installation dès le premier rendu HTML. L'injection
         différée par JS empêchait l'apparition du bouton "Installer". -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="mask-icon" href="/pwa-512x512.png" color="#1B5E20" />

    <!-- Open Graph -->
    <meta property="og:title" content="Apprenons le Coran" />
    <meta property="og:description" content="Application coranique accessible avec commandes vocales" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Apprenons le Coran" />
    <meta name="twitter:description" content="Application coranique accessible avec commandes vocales" />
    <meta name="twitter:image" content="/pwa-512x512.png" />
  </head>

  <body>
    <div id="root">
      <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#fdf6e3;color:#123524;font-family:system-ui,-apple-system,Segoe UI,sans-serif;text-align:center;">
        <section style="max-width:520px;">
          <img src="/pwa-192x192.png" alt="Apprenons le Coran" style="width:88px;height:88px;border-radius:20px;margin-bottom:18px;" />
          <h1 style="font-size:24px;margin:0 0 10px;">Apprenons le Coran</h1>
          <p style="margin:0 0 18px;line-height:1.6;">Chargement de l’application…</p>
          <p style="font-size:14px;margin:0;opacity:.78;">Si l’écran reste bloqué, ouvrez <a href="/reset" style="color:#1b7f5a;font-weight:700;">Réinitialiser</a>.</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
