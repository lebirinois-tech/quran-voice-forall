name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build application
        run: |
          bun install --no-frozen-lockfile
          echo "VITE_GITHUB_REPOSITORY=${{ github.repository }}" >> .env.production
          echo "VITE_APK_DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/latest/download/qaran-acces-pour-tous.apk" >> .env.production
          bun run build
          node - <<'NODE'
          const fs = require('fs');
          const p = 'capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(p, 'utf8'));
          delete config.server;
          fs.writeFileSync(p, JSON.stringify(config, null, 2) + '\n');
          NODE
          bunx cap add android
          bunx cap sync android
          node - <<'NODE'
          const fs = require('fs');
          const p = 'android/variables.gradle';
          let src = fs.readFileSync(p, 'utf8');
          src = src.replace(/minSdkVersion\s*=\s*\d+/, 'minSdkVersion = 24');
          fs.writeFileSync(p, src);
          NODE
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          APK_PATH=$(find android/app/build/outputs/apk -name '*debug*.apk' | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" artifacts/quran-acces-pour-tous.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quran-acces-pour-tous-apk
          path: artifacts/quran-acces-pour-tous.apk

      - name: Publish downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version APK
          body: APK Android 7+ avec Hafs, Warsh et Qaloun en 15 lignes.
          files: artifacts/qaran-acces-pour-tous.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
