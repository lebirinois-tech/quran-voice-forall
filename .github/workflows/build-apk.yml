name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure APK download URL
        run: |
          echo "VITE_GITHUB_REPOSITORY=${{ github.repository }}" >> .env.production
          echo "VITE_APK_DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/latest/download/quran-acces-pour-tous.apk" >> .env.production

      - name: Build web app
        run: bun run build

      - name: Prepare native APK config
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          delete config.server;

          const appId = config.appId || '';
          const validAppId = /^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$/.test(appId);
          if (!validAppId) {
            throw new Error(`Invalid Android appId: ${appId}`);
          }

          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Add Android platform
        run: |
          bunx cap add android
          bunx cap sync android

      - name: Widen Android compatibility (minSdk 23 = Android 6+)
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'android/variables.gradle';
          let src = fs.readFileSync(p, 'utf8');
          src = src.replace(/minSdkVersion\s*=\s*\d+/, 'minSdkVersion = 23');
          if (!/minSdkVersion/.test(src)) {
            src = src.replace('ext {', 'ext {\n    minSdkVersion = 23');
          }
          fs.writeFileSync(p, src);
          console.log(src);
          NODE
          # APK universel (toutes les architectures CPU), pas de split par ABI
          node - <<'NODE'
          const fs = require('fs');
          const p = 'android/app/build.gradle';
          let src = fs.readFileSync(p, 'utf8');
          if (!src.includes('universalApk')) {
            src = src.replace(
              /android\s*\{/,
              `android {\n    splits { abi { enable false; universalApk true } }\n    packagingOptions { jniLibs { useLegacyPackaging true } }`
            );
            fs.writeFileSync(p, src);
          }
          NODE

      - name: Generate Android app icons
        run: |
          mkdir -p assets
          cp public/pwa-512x512.png assets/icon-only.png
          cp public/pwa-512x512.png assets/icon-foreground.png
          cp public/pwa-512x512.png assets/icon.png
          # Solid background derived from the app's emerald theme
          node - <<'NODE'
          const fs = require('fs');
          // 1x1 emerald PNG used as adaptive icon background
          const bg = Buffer.from(
            'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAEElEQVR42mNk+M9QzwAEAAYUAQHQ4eIDAAAAAElFTkSuQmCC',
            'base64'
          );
          fs.writeFileSync('assets/icon-background.png', bg);
          NODE
          bunx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#1b7f5a' --iconBackgroundColorDark '#0f3d2b' --splashBackgroundColor '#1b7f5a' --splashBackgroundColorDark '#0f3d2b'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp "$(find android/app/build/outputs/apk -name '*debug*.apk' | head -n 1)" artifacts/quran-acces-pour-tous.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-acces-pour-tous-apk
          path: artifacts/quran-acces-pour-tous.apk

      - name: Create / Update "latest" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dernière version APK"
          body: "APK Android généré automatiquement depuis le dernier commit."
          files: artifacts/quran-acces-pour-tous.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}