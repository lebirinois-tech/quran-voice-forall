name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.lovable/**'

concurrency:
  group: build-apk
  cancel-in-progress: true


permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Configure APK download URL
        run: |
          echo "VITE_GITHUB_REPOSITORY=${{ github.repository }}" >> .env.production
          echo "VITE_APK_DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/latest/download/quran-acces-pour-tous.apk" >> .env.production

      - name: Build web app
        run: bun run build

      - name: Prepare native APK config
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          delete config.server;

          const appId = config.appId || '';
          const validAppId = /^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$/.test(appId);
          if (!validAppId) {
            throw new Error(`Invalid Android appId: ${appId}`);
          }

          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Add Android platform
        run: |
          bunx cap add android
          bunx cap sync android

      # Signature stable : sans elle, chaque runner signe avec une clé
      # différente et Android refuse la mise à jour (« package en conflit »).
      - name: Configure stable APK signing
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'android/app/build.gradle';
          let app = fs.readFileSync(p, 'utf8');
          if (!app.includes('signingConfigs')) {
            const sc = [
              'android {',
              '    signingConfigs {',
              '        quran {',
              "            storeFile rootProject.file('../signing/quran-acces.keystore')",
              "            storePassword 'quran-acces-2026'",
              "            keyAlias 'quran'",
              "            keyPassword 'quran-acces-2026'",
              '        }',
              '    }',
            ].join('\n');
            app = app.replace(/android\s*\{/, sc);
            const bt = [
              'buildTypes {',
              '        debug {',
              '            signingConfig signingConfigs.quran',
              '        }',
            ].join('\n');
            app = app.replace(/buildTypes\s*\{/, bt);
            fs.writeFileSync(p, app);
          }
          console.log('Stable signing configured');
          NODE

      - name: Set Android compatibility (minSdk 24 = Android 7+)
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'android/variables.gradle';
          let src = fs.readFileSync(p, 'utf8');
          src = src.replace(/minSdkVersion\s*=\s*\d+/, 'minSdkVersion = 24');
          if (!/minSdkVersion/.test(src)) {
            src = src.replace('ext {', 'ext {\n    minSdkVersion = 24');
          }
          fs.writeFileSync(p, src);
          console.log(src);
          const appGradle = 'android/app/build.gradle';
          let app = fs.readFileSync(appGradle, 'utf8');
          app = app.replace(/versionCode\s+\d+/, `versionCode ${1000 + Number(process.env.ANDROID_VERSION_CODE)}`);
          fs.writeFileSync(appGradle, app);
          NODE
          # APK universel : on garde la configuration Capacitor par défaut
          # (pas de patch de android/app/build.gradle, source d'échecs répétés).


      - name: Generate Android app icons
        run: |
          mkdir -p assets
          cp public/pwa-512x512.png assets/icon-only.png
          cp public/pwa-512x512.png assets/icon-foreground.png
          cp public/pwa-512x512.png assets/icon.png
          # Solid background derived from the app's emerald theme
          node - <<'NODE'
          const fs = require('fs');
          // 1x1 emerald PNG used as adaptive icon background
          const bg = Buffer.from(
            'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAEElEQVR42mNk+M9QzwAEAAYUAQHQ4eIDAAAAAElFTkSuQmCC',
            'base64'
          );
          fs.writeFileSync('assets/icon-background.png', bg);
          NODE
          bunx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#1b7f5a' --iconBackgroundColorDark '#0f3d2b' --splashBackgroundColor '#1b7f5a' --splashBackgroundColorDark '#0f3d2b' || echo 'Icon generation skipped'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug


      - name: Rename APK
        run: |
          mkdir -p artifacts
          APK_PATH=$(find android/app/build/outputs/apk -name '*debug*.apk' | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then echo "APK introuvable"; exit 1; fi
          cp "$APK_PATH" artifacts/quran-acces-pour-tous.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-acces-pour-tous-apk
          path: artifacts/quran-acces-pour-tous.apk

      - name: Create / Update "latest" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dernière version APK"
          body: "APK Android généré automatiquement depuis le dernier commit."
          files: artifacts/quran-acces-pour-tous.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact APK version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync('dist/version.json', 'utf8'));
          fs.writeFileSync('/tmp/apk-release-notes.txt',
            'APK Android généré automatiquement depuis le dernier commit.\n\n' +
            '<!-- quran-apk-version:' + JSON.stringify(version) + ' -->\n');
          NODE
          gh release edit latest --repo "${{ github.repository }}" --notes-file /tmp/apk-release-notes.txt