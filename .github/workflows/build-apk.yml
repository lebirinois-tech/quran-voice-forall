name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Configure APK download URL
        run: |
          echo "VITE_GITHUB_REPOSITORY=${{ github.repository }}" >> .env.production
          echo "VITE_APK_DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/latest/download/quran-acces-pour-tous.apk" >> .env.production

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          npm install @capacitor/android @capacitor/cli
          npx cap add android || echo "Android platform already exists"
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/quran-acces-pour-tous.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-acces-pour-tous-apk
          path: artifacts/quran-acces-pour-tous.apk

      - name: Create / Update "latest" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dernière version APK"
          body: "APK Android généré automatiquement depuis le dernier commit."
          files: artifacts/quran-acces-pour-tous.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}